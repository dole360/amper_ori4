<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <script src="app-config.js?v=20260917-1"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="แผนการจัดการเรียนรู้ Lesson Plan">
  <title>แผนการจัดการเรียนรู้ | Lesson Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="plan.css?v=20260922-1">
  <link rel="stylesheet" href="admin-subpage.css?v=20260826-1">
  <link rel="stylesheet" href="plan-manager.css?v=20260922-1">
  <link rel="stylesheet" href="template4.css?v=20260923-template4-v1">
</head>
<body class="lp-template4">
  <main class="plan-page">
    <div class="plan-container">
      <div class="plan-topbar admin-subpage-topbar">
        <button class="admin-manage-data-button" type="button" data-admin-page="plan" hidden>จัดการข้อมูล</button>
        <a class="plan-back" href="index.html" onclick="return backToHome(event)" aria-label="กลับหน้าหลัก">
          ← กลับหน้าหลัก
        </a>
      </div>

      <header class="plan-heading">
        <p>Lesson Plan</p>
        <h1>แผนการจัดการเรียนรู้</h1>
        <span aria-hidden="true"></span>
      </header>

      <section class="plan-panel">
        <div class="plan-toolbar">
          <label for="planLevelFilter">ระดับชั้น</label>
          <select id="planLevelFilter">
            <option value="">ทั้งหมด</option>
          </select>
          <label for="planSearch">ค้นหา</label>
          <input id="planSearch" type="search" placeholder="ค้นหาเรื่อง..." autocomplete="off">
          <strong id="planCount">กำลังโหลด...</strong>
        </div>

        <div id="planStatus" class="plan-status" role="status">
          <span class="plan-spinner" aria-hidden="true"></span>
          <span>กำลังโหลดแผนการจัดการเรียนรู้...</span>
        </div>

        <div class="plan-table-wrap">
          <table class="plan-table">
            <thead>
              <tr>
                <th class="plan-number-column">ลำดับ</th>
                <th>เรื่อง</th>
                <th>ระดับชั้น</th>
                <th>วันที่อัพโหลดไฟล์</th>
                <th class="plan-download-column">ดาวน์โหลดไฟล์</th>
              </tr>
            </thead>
            <tbody id="planTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="plan.js?v=20260922-1"></script>
  <script src="admin-subpage.js?v=20260826-1"></script>
  <script src="plan-manager.js?v=20260922-1"></script>
  <script>
  function backToHome(event) {
    if (event) event.preventDefault();
    if (window.opener && !window.opener.closed) {
      window.close();
      return false;
    }
    if (window.history.length > 1) {
      window.history.back();
      return false;
    }
    window.location.href = 'index.html';
    return false;
  }
  </script>
</body>
</html>
